kind = "web"
previewPath = "/"
title = "VĀC Workspace"
version = "1.0.0"
id = "artifacts/vac-workspace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24382

[services.development]
run = "pnpm --filter @workspace/vac-workspace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vac-workspace", "run", "build" ]
publicDir = "artifacts/vac-workspace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24382"
BASE_PATH = "/"
